services:
  backend:
    image: ghcr.io/ayubazmi/vegah-task/backend:latest
    container_name: taskflow-backend
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=${DB_HOST}
      - REDIS_HOST=${REDIS_HOST}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - PORT=${PORT}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskflow-network

  worker:
    image: ghcr.io/ayubazmi/vegah-task/worker:latest
    container_name: taskflow-worker
    env_file:
      - ./worker/.env
    environment:
      - DB_HOST=${DB_HOST}
      - REDIS_HOST=${REDIS_HOST}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - taskflow-network

  frontend:
    image: ghcr.io/ayubazmi/vegah-task/frontend:latest
    container_name: taskflow-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - taskflow-network

  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-network

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-network

volumes:
  pgdata:

networks:
  taskflow-network:
    driver: bridge
